# Fly.io config. Raw TCP service (the mod speaks newline-delimited JSON over TCP, not HTTP).
# Deploy from the repo root: `fly launch --no-deploy --copy-config --config server/fly.toml`, then
# `fly deploy --config server/fly.toml` (the image needs the mod's relay.lua).
# Players then set Server = <app>.fly.dev and Port = 8788 in the mod's Multiplayer menu.
app = "balatro-mp-relay"
primary_region = "ord"

[build]
  dockerfile = "server/Dockerfile"

[[services]]
  internal_port = 8788
  protocol = "tcp"
  auto_stop_machines = "off"
  min_machines_running = 1

  [[services.ports]]
    port = 8788

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
