# Builds the friend installer (dist\BalatroMultiplayer-Setup.zip) on every push to main and
# publishes it to a rolling "latest" GitHub Release, so these links always have the newest build:
#   https://github.com/<owner>/<repo>/releases/latest/download/BalatroMultiplayer-Setup.zip
#   https://github.com/<owner>/<repo>/releases/latest/download/install-mac.sh   (Mac one-liner)
# The Mac scripts are uploaded on their own too, so Mac players can `curl ... | bash` them.
name: Build installer

on:
  push:
    branches: [main]
    paths:
      - 'mod/**'
      - 'installer/**'
      - 'tools/build-friend-package.ps1'
      - '.gitattributes'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build installer zip
        shell: pwsh
        run: ./tools/build-friend-package.ps1

      - name: Publish to the "latest" release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short=$(git rev-parse --short HEAD)
          notes="Built from commit ${short} on $(date -u +'%Y-%m-%d %H:%M UTC').

          **Windows:** download BalatroMultiplayer-Setup.zip below, unzip it, close Balatro, and double-click Install.bat.
          **Mac:** quit Balatro, open Terminal and run:
          \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install-mac.sh | bash\`

          You need Balatro on Steam, launched at least once. Windows and Mac players can play together."

          assets=(dist/BalatroMultiplayer-Setup.zip installer/install-mac.sh installer/uninstall-mac.sh installer/common-mac.sh)

          # Move the tag to this commit.
          git tag -f latest
          git push -f origin refs/tags/latest

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest "${assets[@]}" --clobber
            gh release edit latest --title "Latest build (${short})" --notes "$notes" --latest
          else
            gh release create latest "${assets[@]}" \
              --title "Latest build (${short})" --notes "$notes" --latest
          fi
