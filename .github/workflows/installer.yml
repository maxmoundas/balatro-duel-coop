# Builds the release zips on every push to main (as a check, nothing is published), and
# publishes a versioned GitHub Release when a version tag is pushed:
#   git tag v1.0.0 && git push origin v1.0.0
# The tag must match "version" in mod/BalatroDuelCoop/BalatroDuelCoop.json.
# The newest release is marked Latest, so these links always give the newest version:
#   https://github.com/<owner>/<repo>/releases/latest/download/BalatroDuelCoop-Setup.zip
#   https://github.com/<owner>/<repo>/releases/latest/download/BalatroDuelCoop.zip   (Mod Index / mod managers)
#   https://github.com/<owner>/<repo>/releases/latest/download/install-mac.sh        (Mac one-liner)
# The Mac scripts are uploaded on their own too, so Mac players can `curl ... | bash` them.
# BalatroDuelCoop-Thunderstore.zip is attached for uploading to Thunderstore by hand.
name: Build installer

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'mod/**'
      - 'installer/**'
      - 'publish/thunderstore/**'
      - 'tools/build-friend-package.ps1'
      - '.gitattributes'
      - '.github/workflows/installer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build zips
        shell: pwsh
        run: ./tools/build-friend-package.ps1

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' mod/BalatroDuelCoop/BalatroDuelCoop.json)
          if [ "$tag" != "v$version" ]; then
            echo "Tag $tag doesn't match the mod version $version (expected v$version)." >&2
            exit 1
          fi
          notes="**Windows:** download BalatroDuelCoop-Setup.zip below, unzip it, close Balatro, and double-click Install.bat.
          **Mac:** quit Balatro, open Terminal and run:
          \`curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install-mac.sh | bash\`

          You need Balatro on Steam, launched at least once. Windows and Mac players can play together.

          Using a mod manager or installing by hand? BalatroDuelCoop.zip is just the mod folder: put it in your Mods folder next to Steamodded."

          # Release notes for this version (docs/releases/vX.Y.Z.md) go above the install steps.
          if [ -f "docs/releases/${tag}.md" ]; then
            notes="$(cat "docs/releases/${tag}.md")

          ---

          ${notes}"
          fi

          assets=(dist/BalatroDuelCoop-Setup.zip dist/BalatroDuelCoop.zip dist/BalatroDuelCoop-Thunderstore.zip
                  installer/install-mac.sh installer/uninstall-mac.sh installer/common-mac.sh)

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" "${assets[@]}" --title "Balatro Duel & Co-op $tag" --notes "$notes" --latest
          fi
